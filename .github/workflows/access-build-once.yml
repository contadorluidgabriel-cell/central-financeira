name: Access Polish Once

on:
  push:
    branches:
      - fix/acesso-clientes
    paths:
      - .github/workflows/access-build-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acesso-clientes
          fetch-depth: 0
      - name: Polish status styles and clean workflow
        run: |
          python -c "from pathlib import Path; p=Path('components/CentralFinanceiraV2.jsx'); s=p.read_text(); s=s.replace(\"const accessClass = !access ? 'warn' : !access.active ? 'bad' : access.mustChangePassword ? 'warn' : 'good';\", \"const accessClass = !access ? 'wait' : !access.active ? 'closed' : access.mustChangePassword ? 'wait' : 'ok';\"); p.write_text(s)"
          rm .github/workflows/access-build-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalizar acesso de clientes" || exit 0
          git push origin HEAD:fix/acesso-clientes
