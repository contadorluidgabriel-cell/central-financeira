name: Access Build Once

on:
  push:
    branches:
      - fix/acesso-clientes
    paths:
      - .github/workflows/access-build-once.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
