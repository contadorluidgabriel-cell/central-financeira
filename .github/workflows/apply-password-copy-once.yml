name: Apply standalone password copy (one-time)
on:
  push:
    branches:
      - feature/ofx-lote-competencia-copia-senha
    paths:
      - .github/workflows/apply-password-copy-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add password copy control
        run: node scripts/add-password-copy-once.mjs
      - name: Validate build
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run test:ofx
          node --test tests/ofx-batch-choices.test.mjs
          npm run build
      - name: Commit validated change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/CentralFinanceiraV2.jsx
          git commit -m 'feat(acesso): copy temporary password separately'
          git push
