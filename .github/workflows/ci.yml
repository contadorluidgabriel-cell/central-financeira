name: CI

on:
  push:
    branches: [main, feat/nextjs-migration]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test unified entry modes
        run: npm run test:entry-mode
      - name: Test OFX parser
        run: npm run test:ofx
      - name: Test client access recovery
        run: npm run test:access
      - name: Build
        run: npm run build
