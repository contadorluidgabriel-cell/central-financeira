name: Client welcome message UI patch (one-time)
on:
  push:
    branches: [feature/convite-cliente-copiar-mensagem]
    paths: ['.github/workflows/client-welcome-message-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/convite-cliente-copiar-mensagem
          persist-credentials: true
      - name: Apply exact guarded UI patch
        run: node scripts/apply-client-welcome-message-once.mjs
      - name: Validate, build and commit
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run test:ofx
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CentralFinanceiraV2.jsx
          git diff --cached --stat
          git commit -m "feat(acesso): add welcome message preview and copy button"
          git push origin HEAD:feature/convite-cliente-copiar-mensagem
