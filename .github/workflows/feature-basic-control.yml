name: Feature Basic Control

on:
  push:
    branches: [feat/controle-basico]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Basic integration
        run: |
          if ! grep -q "import { BASIC_EXPENSE_MODES" components/SimpleControlAppV2.jsx; then
            python scripts/apply-basic-ui-integration.py
          else
            echo "Basic UI integration already applied"
          fi
      - name: Apply Simple to Basic upgrade
        run: |
          if ! grep -q "onUpgradeBasic" components/SimpleControlAppV2.jsx; then
            python scripts/apply-simple-basic-upgrade.py
          else
            echo "Simple upgrade integration already applied"
          fi
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet -- components/SimpleControlAppV2.jsx components/BasicControlAppV1.jsx components/SimpleControlApp.module.css lib/neon-simple-control.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SimpleControlAppV2.jsx components/BasicControlAppV1.jsx components/SimpleControlApp.module.css lib/neon-simple-control.js
          git commit -m "feat: permitir evolução do Controle Simples para Básico"
          git push origin HEAD:feat/controle-basico
