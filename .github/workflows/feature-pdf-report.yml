name: Feature PDF Report

on:
  push:
    branches: [feat/relatorio-pdf-controle-simples]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply PDF integration
        run: |
          if ! grep -q "generateSimpleRevenuePdf" components/SimpleControlAppV2.jsx; then
            python scripts/apply-pdf-report.py
          else
            echo "PDF integration already applied"
          fi
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet -- components/SimpleControlAppV2.jsx; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SimpleControlAppV2.jsx
          git commit -m "feat: integrar relatório PDF ao Controle Simples"
          git push origin HEAD:feat/relatorio-pdf-controle-simples
