name: Feature Simple Import

on:
  push:
    branches: [feat/controle-simples-importacao]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply import integration
        run: |
          if ! grep -q "SimpleRevenueImport from" components/SimpleControlAppV2.jsx; then
            python scripts/apply-simple-import.py
          else
            echo "Import integration already applied"
          fi
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit generated integration
        run: |
          if git diff --quiet -- components/SimpleControlAppV2.jsx lib/neon-simple-control.js components/SimpleControlApp.module.css; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SimpleControlAppV2.jsx lib/neon-simple-control.js components/SimpleControlApp.module.css
          git commit -m "feat: integrar importação avançada ao Controle Simples"
          git push origin HEAD:feat/controle-simples-importacao
