name: Fix Client Access Once

on:
  push:
    branches:
      - fix/acesso-clientes
    paths:
      - .github/workflows/fix-client-access-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acesso-clientes
          fetch-depth: 0
      - name: Apply client access integration
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar acesso de clientes ao painel" || exit 0
          git push origin HEAD:fix/acesso-clientes
