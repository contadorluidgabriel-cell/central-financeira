name: Fix Client Access Once

on:
  push:
    branches:
      - fix/acesso-clientes
    paths:
      - .github/workflows/fix-client-access-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acesso-clientes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply client access integration
        shell: python
        run: |
          from pathlib import Path
          import re

          v2_path = Path('lib/neon-v2-data.js')
          v2 = v2_path.read_text()
          if "./client-access" not in v2:
              v2 = v2.replace("import {\n  createCompany as createBaseCompany,\n  loadCentralData,\n  normalizeError,\n  unwrap\n} from './neon-live-data';", "import {\n  createCompany as createBaseCompany,\n  loadCentralData,\n  normalizeError,\n  unwrap\n} from './neon-live-data';\nimport { loadClientAccess } from './client-access';")
          v2 = v2.replace("  const base = await loadCentralData(activeOrganizationId);\n  if (base.reload) return base;\n", "  const base = await loadCentralData(activeOrganizationId);\n  if (base.reload) return base;\n  const clientAccess = base.systemRole === 'super_admin' ? await loadClientAccess() : [];\n")
          v2 = v2.replace("  return {\n    ...base,\n    profiles:", "  return {\n    ...base,\n    clientAccess,\n    profiles:")
          v2_path.write_text(v2)

          p = Path('components/CentralFinanceiraV2.jsx')
          s = p.read_text()

          if "../lib/client-access" not in s:
              s = s.replace("} from '../lib/neon-v2-data';\nimport styles", "} from '../lib/neon-v2-data';\nimport { createClientAccess, resetClientPassword, setClientAccessBlocked } from '../lib/client-access';\nimport styles")

          s = s.replace("  const [companyDraft, setCompanyDraft] = useState(defaultCompanyDraft());\n", "  const [companyDraft, setCompanyDraft] = useState(defaultCompanyDraft());\n  const [accessDraft, setAccessDraft] = useState({ email: '' });\n  const [accessResult, setAccessResult] = useState(null);\n")

          old_table = '''  function PortfolioTable({ rows }) {
    if (!rows.length) return <EmptyState icon="users" title="Nenhum cliente cadastrado" text="Cadastre a primeira empresa para começar a montar o acompanhamento financeiro." action={() => { setCompanyDraft(defaultCompanyDraft()); setModal({ type: 'company' }); }} actionLabel="Novo cliente"/>;
    return <div className="tablewrap"><table><thead><tr><th>Cliente</th><th>Receitas</th><th>A receber</th><th>A pagar</th><th>Projeção</th><th>Competência</th><th/></tr></thead><tbody>{rows.map(c => { const s = summaryFor(c.id); const st = competenceStatus(c.id); return <tr key={c.id} className="clickable" onClick={() => openWorkspace(c.id)}><td><div className="companycell"><div className="avatar">{initials(c.name)}</div><div><strong>{c.name}</strong><span>{c.document || 'Documento não informado'}</span></div></div></td><td>{money(s.revenue)}</td><td>{money(s.receivable)}</td><td>{money(s.payable)}</td><td><b className={s.projected < 0 ? 'negative' : 'positive'}>{money(s.projected)}</b></td><td><span className={`status ${st[1]}`}>{st[0]}</span></td><td><Icon name="arrow"/></td></tr>; })}</tbody></table></div>;
  }
'''
          new_table = '''  function PortfolioTable({ rows }) {
    if (!rows.length) return <EmptyState icon="users" title="Nenhum cliente cadastrado" text="Cadastre a primeira empresa para começar a montar o acompanhamento financeiro." action={() => { setCompanyDraft(defaultCompanyDraft()); setModal({ type: 'company' }); }} actionLabel="Novo cliente"/>;
    return <div className="tablewrap"><table><thead><tr><th>Cliente</th><th>Acesso</th><th>Receitas</th><th>A receber</th><th>A pagar</th><th>Projeção</th><th>Competência</th><th/></tr></thead><tbody>{rows.map(c => { const s = summaryFor(c.id); const st = competenceStatus(c.id); const access = (state.clientAccess || []).find(item => item.organizationId === c.id); const accessLabel = !access ? 'Sem acesso' : !access.active ? 'Bloqueado' : access.mustChangePassword ? 'Senha provisória' : 'Ativo'; const accessClass = !access ? 'warn' : !access.active ? 'bad' : access.mustChangePassword ? 'warn' : 'good'; return <tr key={c.id} className="clickable" onClick={() => openWorkspace(c.id)}><td><div className="companycell"><div className="avatar">{initials(c.name)}</div><div><strong>{c.name}</strong><span>{c.document || 'Documento não informado'}</span></div></div></td><td><div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}><span className={`status ${accessClass}`}>{accessLabel}</span><button type="button" className="btn btn-secondary" style={{minHeight:32,padding:'6px 10px',fontSize:12}} onClick={event=>{event.stopPropagation();setAccessResult(null);setAccessDraft({email:access?.email||c.contact||''});setModal({type:'access',companyId:c.id})}}>{access?'Gerenciar':'Criar acesso'}</button></div></td><td>{money(s.revenue)}</td><td>{money(s.receivable)}</td><td>{money(s.payable)}</td><td><b className={s.projected < 0 ? 'negative' : 'positive'}>{money(s.projected)}</b></td><td><span className={`status ${st[1]}`}>{st[0]}</span></td><td><Icon name="arrow"/></td></tr>; })}</tbody></table></div>;
  }
'''
          if old_table not in s:
              raise SystemExit('PortfolioTable target not found')
          s = s.replace(old_table, new_table)

          old_company = '''    if (modal.type === 'company') return <ModalShell title="Novo cliente" footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button><button className="btn btn-primary" disabled={busy||!companyDraft.name.trim()} onClick={async()=>{const id=await run(()=>createCompanyV2(companyDraft),null,{refreshAfter:false});if(id){await refresh(false);setModal(null);setCompanyDraft(defaultCompanyDraft());setToast('Cliente criado. A configuração financeira será escolhida por ele no primeiro acesso.')}}}>Criar cliente</button></>}><div className={styles.formGrid2}><div className="field full"><label>Nome da empresa</label><input className="input" value={companyDraft.name} onChange={e=>setCompanyDraft(d=>({...d,name:e.target.value}))} autoFocus/></div><div className="field"><label>CNPJ / CPF</label><input className="input" value={companyDraft.document} onChange={e=>setCompanyDraft(d=>({...d,document:e.target.value}))}/></div><div className="field"><label>E-mail principal</label><input className="input" type="email" value={companyDraft.contact} onChange={e=>setCompanyDraft(d=>({...d,contact:e.target.value}))}/></div></div><div className={styles.modalHint}><b>Configuração pelo cliente:</b> você cadastra a empresa e libera o acesso. No primeiro acesso, o próprio cliente escolhe o nível de controle e como deseja acompanhar as informações.</div></ModalShell>;
'''
          new_company = '''    if (modal.type === 'company') return <ModalShell title="Novo cliente" footer={<><button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button><button className="btn btn-primary" disabled={busy||!companyDraft.name.trim()} onClick={async()=>{const draft={...companyDraft};const id=await run(()=>createCompanyV2(draft),null,{refreshAfter:false});if(id){await refresh(false);setCompanyDraft(defaultCompanyDraft());if(draft.contact.trim()){setAccessResult(null);setAccessDraft({email:draft.contact.trim()});setModal({type:'access',companyId:id})}else{setModal(null);setToast('Cliente criado. Crie o acesso quando tiver o e-mail de login.')}}}}>Criar cliente</button></>}><div className={styles.formGrid2}><div className="field full"><label>Nome da empresa</label><input className="input" value={companyDraft.name} onChange={e=>setCompanyDraft(d=>({...d,name:e.target.value}))} autoFocus/></div><div className="field"><label>CNPJ / CPF</label><input className="input" value={companyDraft.document} onChange={e=>setCompanyDraft(d=>({...d,document:e.target.value}))}/></div><div className="field"><label>E-mail principal</label><input className="input" type="email" value={companyDraft.contact} onChange={e=>setCompanyDraft(d=>({...d,contact:e.target.value}))}/></div></div><div className={styles.modalHint}><b>Próxima etapa:</b> cadastre a empresa aqui. Depois, crie o acesso com e-mail e senha provisória. No primeiro login, o cliente troca a senha e escolhe como quer controlar a própria empresa.</div></ModalShell>;
'''
          if old_company not in s:
              raise SystemExit('Company modal target not found')
          s = s.replace(old_company, new_company)

          marker = "    if (!c) return null;\n"
          access_block = '''    if (!c) return null;
    if (modal.type === 'access') {
      const access = (state.clientAccess || []).find(item => item.organizationId === c.id) || null;
      const statusLabel = !access ? 'Sem acesso' : !access.active ? 'Bloqueado' : access.mustChangePassword ? 'Senha provisória' : 'Ativo';
      const closeAccess = () => { setAccessResult(null); setModal(null); };
      const copyCredentials = async () => {
        if (!accessResult?.temporaryPassword) return;
        const text = `Central Financeira\nAcesso: https://centralfinanceira-peach.vercel.app\nE-mail: ${accessResult.email}\nSenha provisória: ${accessResult.temporaryPassword}\n\nNo primeiro acesso, crie sua senha pessoal.`;
        try { await navigator.clipboard.writeText(text); setToast('Credenciais copiadas.'); }
        catch { setToast('Não foi possível copiar automaticamente.'); }
      };
      const createAccess = async () => {
        const result = await run(()=>createClientAccess({organizationId:c.id,email:accessDraft.email,name:c.name}),null,{refreshAfter:false});
        if(result){setAccessResult(result);await refresh(true);setToast('Acesso criado com senha provisória.');}
      };
      const resetPassword = async () => {
        const result = await run(()=>resetClientPassword({userId:access.userId,email:access.email}),null,{refreshAfter:false});
        if(result){setAccessResult(result);await refresh(true);setToast('Nova senha provisória gerada.');}
      };
      const toggleBlocked = async () => {
        const blocked = access.active;
        const result = await run(async()=>{await setClientAccessBlocked({userId:access.userId,blocked});return true},null,{refreshAfter:false});
        if(result){setAccessResult(null);await refresh(true);setToast(blocked?'Acesso bloqueado.':'Acesso reativado.');}
      };
      return <ModalShell title="Acesso do cliente" footer={<><button className="btn btn-secondary" onClick={closeAccess}>Fechar</button>{!access&&!accessResult&&<button className="btn btn-primary" disabled={busy||!accessDraft.email.trim()} onClick={createAccess}>Criar acesso</button>}</>}><div style={{display:'grid',gap:16}}><div><strong style={{display:'block',fontSize:15}}>{c.name}</strong><span className="muted" style={{fontSize:13}}>{c.document || 'Documento não informado'}</span></div>{accessResult?.temporaryPassword ? <><div className={styles.modalHint}><b>Senha provisória criada.</b> Ela é mostrada somente agora. Copie as credenciais e envie ao cliente pelo seu canal habitual.</div><div className={styles.formGrid2}><div className="field full"><label>E-mail de login</label><input className="input" readOnly value={accessResult.email}/></div><div className="field full"><label>Senha provisória</label><input className="input" readOnly value={accessResult.temporaryPassword} onFocus={e=>e.currentTarget.select()}/></div></div><button type="button" className="btn btn-primary" onClick={copyCredentials}>Copiar credenciais</button></> : !access ? <><div className="field"><label>E-mail de login</label><input className="input" type="email" value={accessDraft.email} onChange={e=>setAccessDraft({email:e.target.value})} autoFocus/><span className="help">O sistema gera uma senha provisória. No primeiro login, o cliente será obrigado a criar a própria senha.</span></div></> : <><div className={styles.settlementSummary}><div><span>Status</span><strong>{statusLabel}</strong></div><div><span>E-mail</span><strong style={{fontSize:13}}>{access.email}</strong></div><div><span>Último acesso</span><strong style={{fontSize:13}}>{access.lastLoginAt?new Date(access.lastLoginAt).toLocaleString('pt-BR'):'Ainda não acessou'}</strong></div></div><div style={{display:'flex',gap:10,flexWrap:'wrap'}}><button type="button" className="btn btn-secondary" disabled={busy||!access.active} onClick={resetPassword}>Redefinir senha</button><button type="button" className="btn btn-secondary" disabled={busy} onClick={toggleBlocked}>{access.active?'Bloquear acesso':'Reativar acesso'}</button></div><div className={styles.modalHint}>{access.mustChangePassword?<><b>Senha provisória pendente:</b> o cliente ainda precisa entrar e criar a própria senha.</>:<><b>Acesso ativo:</b> a senha atual nunca é exibida ao administrador. Se o cliente esquecer, gere uma nova senha provisória.</>}</div></>}</div></ModalShell>;
    }
'''
          if marker not in s:
              raise SystemExit('Modal access insertion target not found')
          s = s.replace(marker, access_block, 1)

          s = s.replace('<Modal/>{toast&&', '{Modal()}{toast&&')
          p.write_text(s)

          wf = Path('.github/workflows/fix-client-access-once.yml')
          wf.unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrar acesso de clientes ao painel" || exit 0
          git push origin HEAD:fix/acesso-clientes
