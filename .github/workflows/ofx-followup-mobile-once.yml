name: OFX follow-up and mobile patch (one-time)
on:
  push:
    branches: [feature/ofx-followup-mobile]
    paths: ['.github/workflows/ofx-followup-mobile-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ofx-followup-mobile
          persist-credentials: true
      - name: Apply guarded source replacements
        run: node scripts/apply-ofx-followup-mobile-once.mjs
      - name: Validate, build and commit
        run: |
          git diff --check
          npm install
          npm run test:ofx
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ImportCenter.jsx components/OfxImportLauncher.jsx components/OfxEntryPostingLauncher.jsx components/ImportCenter.module.css components/OfxImportLauncher.module.css components/OfxEntryPostingLauncher.module.css
          git diff --cached --stat
          git commit -m "feat(importacoes): connect OFX import to review and optimize mobile UI"
          git push origin HEAD:feature/ofx-followup-mobile
