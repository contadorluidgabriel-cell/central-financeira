name: OFX posting validation patch (one-time)

on:
  push:
    branches: [fix/ofx-posting-invalid-identifier]
    paths: ['.github/workflows/ofx-post-validation-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/ofx-posting-invalid-identifier
          persist-credentials: true
      - name: Apply guarded source replacements
        run: node scripts/apply-ofx-post-validation-once.mjs
      - name: Validate and commit
        run: |
          git diff --check
          npm install
          npm run test:ofx
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/OfxEntryPostingLauncher.jsx package.json
          git diff --cached --stat
          git commit -m "fix(ofx): validate posting IDs and distinguish server rejection"
          git push origin HEAD:fix/ofx-posting-invalid-identifier
