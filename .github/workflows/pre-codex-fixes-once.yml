name: Pre Codex Fixes Once

on:
  push:
    branches:
      - fix/melhorias-pre-codex
    paths:
      - scripts/apply_pre_codex_fixes.py
      - .github/workflows/pre-codex-fixes-once.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/melhorias-pre-codex
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: python scripts/apply_pre_codex_fixes.py
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components lib
          git diff --cached --quiet && exit 0
          git commit -m "fix: alinhar acesso, despesas e importação"
          git push origin HEAD:fix/melhorias-pre-codex
