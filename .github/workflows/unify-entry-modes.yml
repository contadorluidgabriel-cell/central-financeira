name: Apply unified entry mode fix

on:
  push:
    branches: [fix/unified-entry-mode]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update the affected components with strict anchors
        run: python3 scripts/unify_entry_modes.py
      - name: Test unified preference and regression suite
        run: |
          node --test tests/unified-entry-mode.test.mjs
          npm install
          npm run test:ofx
          npm run test:access
          npm run build
      - name: Commit verified changes and remove one-off tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/unify_entry_modes.py .github/workflows/unify-entry-modes.yml
          git add components/BasicControlAppV1.jsx components/SimpleControlAppV2.jsx components/CentralFinanceiraV2.jsx lib/neon-simple-control-legacy.js
          git commit -m 'feat: unify entry modes across onboarding, settings and tier transitions'
          git push origin HEAD:fix/unified-entry-mode
